name: Weekly data update

on:
  schedule:
    # UTC 周五 02:00 = 北京时间周五 10:00（官方周报周三/四发布，周五抓取安全）
    - cron: "0 2 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write   # 回写 data/
  pages: write      # 部署 Pages
  id-token: write   # deploy-pages 所需

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 统一管线：不再用 chinacdc 首页可达性跳过独立省站，各源直接尝试并各自超时。
      # 退出码 0=全部成功 1=部分失败（仍生成诚实降级页） 2=管线/构建失败。
      - name: Run pipeline (cloud)
        id: pipeline
        continue-on-error: true
        timeout-minutes: 45
        run: python -X utf8 src/run_pipeline.py --cloud --timeout 1200

      # 单独记录 pipeline exit 与 site_ready，避免仅靠 continue-on-error 掩盖构建失败
      - name: Record pipeline outcome
        id: outcome
        if: always()
        run: |
          # run_pipeline 的真实退出码会被 step outcome 掩盖，改用 last_run.json 记录判定
          ptr=".tmp_pipeline/last_run.json"
          if [ -f "$ptr" ]; then
            site_ready=$(python -c "import json;print(str(json.load(open('$ptr'))['site_ready']).lower())")
            exit_code=$(python -c "import json;print(json.load(open('$ptr'))['exit'])")
            run_id=$(python -c "import json;print(json.load(open('$ptr'))['run_id'])")
          else
            site_ready=false; exit_code=2; run_id=""
          fi
          echo "pipeline_exit=$exit_code"
          echo "site_ready=$site_ready"
          echo "run_id=$run_id"
          echo "pipeline_exit=$exit_code" >> "$GITHUB_OUTPUT"
          echo "site_ready=$site_ready" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Commit data back to repo
        if: steps.outcome.outputs.site_ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "chore(data): weekly update $(date -u +%F)"
            git push
          fi

      # 只有构建成功（site_ready=true）才上传，管线退出 2 时阻止上传
      - name: Upload Pages artifact
        if: steps.outcome.outputs.site_ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_publish  # A2-SEARCH-05：只部署本轮验证过的首页（site/ 内历史文件不进 artifact）

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.outcome.outputs.site_ready == 'true'
        uses: actions/deploy-pages@v5

      # 部分失败（exit=1）：仍部署降级页面，但显式告警，不让绿色掩盖数据缺口
      - name: Warn on partial failure
        if: steps.outcome.outputs.site_ready == 'true' && steps.outcome.outputs.pipeline_exit != '0'
        run: |
          echo "::warning::部分数据源失败（pipeline_exit=${{ steps.outcome.outputs.pipeline_exit }}），已部署诚实降级页面"

      # 部分失败时让 run 显示为失败，但保留已完成的提交与部署（不掩盖问题）
      - name: Fail on pipeline error
        if: steps.outcome.outputs.site_ready != 'true'
        run: |
          echo "::error::构建未通过校验（pipeline_exit=${{ steps.outcome.outputs.pipeline_exit }}），已跳过上传与部署"
          exit 1
